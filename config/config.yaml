defaults:
  - dataset: clip1
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

exp_name: ???
seed: 42
device: cuda  # set to cpu to force CPU
mode: train  # train or infer
debug: true

scratch_dir: data/scratch
save_dir: ${scratch_dir}/experiments/${exp_name}

datasets: clip1

data:
  csv_path: ${dataset.feature_csv}
  feature_cols:
    - n_words
    - tiny
    - tiny.en
    - base
    - base.en
    - small
    - small.en
    - medium
    - medium.en
    - large
    - large-v2
    - large-v3
    - large-v3-turbo
    - stoi
    - estoi
    - pesq
    - dns_sig
    - dns_bak
    - dns_ovrl

model:
  d_model: 64
  nhead: 4
  num_layers: 1
  dropout: 0.1
  n_hearing: 3

train:
  batch_size: 1024
  epochs: 100
  lr: 1e-4
  corr_lambda: 0.4
  val_split: 0.2

infer:
  splits:
    - valid
    - eval
  clamp_scores: true
  scale_to_percentage: true
  output_name:
    train: train_inference.csv
    valid: valid_inference.csv
    eval: eval_inference.csv

hydra:
  run:
    dir: .
  output_subdir: null
  sweep:
    dir: .
    subdir: sweep
  job:
    chdir: false
